[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl_predictor"
version = "0.1.0"
description = "Premier League match outcome, scoreline, and betting-market predictor"
requires-python = ">=3.10"
dependencies = [
    "penaltyblog>=1.12.0",
    # A floor, deliberately not a pin. The date-resolution bug that CI found was
    # fixed in code (`features/date_keys.py`), because a pin would only make this
    # machine and CI agree and leave the next cache written by a different version
    # free to disagree again. So correctness no longer depends on the version -- but
    # a floor is still worth having, because datetime *resolution inference*
    # (`s` vs `us` vs `ns`) only exists from pandas 2.0, and an unbounded
    # `pandas` will happily install a 1.x that behaves differently again.
    "pandas>=2.0",
    "numpy",
    "scipy",
    "xgboost",
    "scikit-learn",
    "requests",
    "python-dotenv",
    "fastapi",
    # api/schemas.py imports pydantic directly. It arrives transitively via
    # fastapi today, but a direct import should be a direct declaration.
    "pydantic>=2.9",
    "uvicorn[standard]",
    "optuna",
]

[project.optional-dependencies]
dev = ["jupyter", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "network: needs a live upstream API or a gitignored data/cache fetch; deselect with '-m \"not network\"'",
]
