[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl_predictor"
version = "0.1.0"
description = "Premier League match outcome, scoreline, and betting-market predictor"
requires-python = ">=3.10"
dependencies = [
    "penaltyblog>=1.12.0",
    "pandas",
    "numpy",
    "scipy",
    "xgboost",
    "scikit-learn",
    "requests",
    "python-dotenv",
    "fastapi",
    # api/schemas.py imports pydantic directly. It arrives transitively via
    # fastapi today, but a direct import should be a direct declaration.
    "pydantic>=2.9",
    "uvicorn[standard]",
    "optuna",
]

[project.optional-dependencies]
dev = ["jupyter", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "network: needs a live upstream API or a gitignored data/cache fetch; deselect with '-m \"not network\"'",
]
