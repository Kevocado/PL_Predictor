[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl_predictor"
version = "0.1.0"
description = "Premier League match outcome, scoreline, and betting-market predictor"
requires-python = ">=3.10"
dependencies = [
    "penaltyblog>=1.12.0",
    # A floor, deliberately not a pin. The date-resolution bug fixed in
    # `features/date_keys.py` is handled in code, because a pin would only make this
    # machine and CI agree and leave the next cache written by a different version free
    # to disagree. But datetime *resolution inference* (`s` vs `us` vs `ns`) only exists
    # from pandas 2.0, and an unbounded `pandas` will install a 1.x that behaves
    # differently again.
    "pandas>=2.0",
    "numpy",
    "scipy",
    "xgboost",
    "scikit-learn",
    "requests",
    "python-dotenv",
    "fastapi",
    # api/schemas.py imports pydantic directly. It arrives transitively via
    # fastapi today, but a direct import should be a direct declaration.
    "pydantic>=2.9",
    "uvicorn[standard]",
    "optuna",
]

[project.optional-dependencies]
# `ruff` is not optional decoration: `tests.yml` runs
# `ruff check src tests --select E9,F63,F7,F82 || exit 1`, and without ruff in `dev`
# that step could never pass. It was missing here as well as in CFB and NFL -- three
# repos, one mistake. Adding it immediately found a real bug in a file written earlier
# the same day: an annotation naming `np` where the import was function-local.
dev = ["jupyter", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Registered so `@pytest.mark.network` does not warn, and so the guard in
# tests/conftest.py has a marker to look for. No test carries it yet -- see
# the note in tests/conftest.py -- so this is the opt-in, not a description of
# the current split. Unregistered markers are silently collected as unknown, and
# a marker that only appears in a conftest is a marker nothing can be selected
# by from the command line.
markers = [
  "network: needs live network access; blocked by default, opt in explicitly",
]
