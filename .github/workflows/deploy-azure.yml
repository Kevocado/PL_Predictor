name: Deploy to Azure Container Apps

on:
  # Everything runs on the VPS now: this Azure deploy no longer fires on push
  # or PR. Run it by hand from the Actions tab only if Azure is ever needed.
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        run: |
          docker build -t ghcr.io/kevocado/pl-predictor:${{ github.sha }} -t ghcr.io/kevocado/pl-predictor:latest .
          docker push ghcr.io/kevocado/pl-predictor:${{ github.sha }}
          docker push ghcr.io/kevocado/pl-predictor:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name pl-predictor \
            --resource-group predictor-hub-rg \
            --image ghcr.io/kevocado/pl-predictor:${{ github.sha }}
