name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so the `network` half below is covered by something automatic.
  # It used to run only on `workflow_dispatch`, which meant the only test that
  # needs the live upstreams was verified when a human remembered to ask --
  # i.e. rarely, and never on the commit that broke it. Off the hour and away
  # from the top of the day, because `refresh-public-snapshot.yml` also runs on
  # a 20-minute schedule and the two have no reason to collide.
  schedule:
    - cron: "37 4 * * *"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # `pip install -e .` silently no-ops the editable install on some runners
    # here, so every job exports PYTHONPATH instead of relying on it.
    runs-on: ubuntu-latest
    # This suite needs the network -- see the note on the gating step -- so without
    # a timeout a slow or hanging upstream leaves the gate pending for GitHub's
    # 6-hour default, which is worse than a red gate: it reads as "in progress"
    # rather than "broken".
    #
    # The value is 90, and the reason it is not smaller is a deadlock this file
    # walked into twice. The reasoning used to read "a warm run is ~13 minutes,
    # the first run is cold and does not finish in 30, so 30 was too tight and
    # 60 is generous". The cold duration was then measured, on this machine, on
    # 2026-09-28, and it is **4926.07s -- 1h22m**:
    #
    #     cold + network allowed     4926.07s (1:22:06)  4,723 cache files, 87MB
    #     cold + network, gate half  2594.15s (0:43:14)
    #     warm + guard                669.66s (0:11:09)
    #
    # 60 minutes is 3600s, which is *less than the cold cost*. The job is killed
    # before `actions/cache`'s post step runs, so it saves no cache, so the next
    # run is cold too, so it times out again. The warm step and the cold start
    # feed each other, and no timeout below 4926.07s fixes that -- it makes it
    # permanent. `tests/test_tests_workflow.py` asserts the setting is at least
    # the duration this comment claims, so the two cannot drift apart again.
    #
    # If a future run fails at 90m, the cache is the first thing to look at, not
    # the tests.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Stamp the day
        # The upstream caches are keyed by date, not by run. See below.
        id: date
        run: echo "stamp=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore upstream caches
        # `data/cache/` is gitignored, so without this every run re-downloads
        # seasons of FPL player-gameweek history, ClubElo and football-data.co.uk.
        #
        # The key used to be `pl-upstream-caches-${{ github.run_id }}`, which is
        # unique per run. A cache entry is immutable once written, so that pattern
        # never *updates* anything: every run restores the newest prefix match and
        # then writes a fresh full copy under its own key. It works, and it also
        # fills the 10GB repository cache limit with near-duplicate copies of the
        # same ~10MB until eviction starts dropping entries unpredictably.
        #
        # Keying on the UTC date gives one shared entry per day, refreshed daily --
        # which is the right cadence for upstream data that changes on matchdays.
        #
        # The `id` is load-bearing: the warm step below is skipped when a cache
        # was actually restored. Without it every run pays the warm step's cost
        # even when there is nothing to warm, which doubles the gate's wall time
        # for no reason. A CI runner is a cold clone on its *first* run, not on
        # every run, and this is what makes the second one cheap.
        id: cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: pl-upstream-caches-${{ steps.date.outputs.stamp }}
          restore-keys: pl-upstream-caches-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest pytest-mock ruff

      - name: Warm the upstream cache
        # `data/cache/` is gitignored, so a fresh CI runner has none of it, and the
        # network guard in `tests/conftest.py` (from origin/main) then blocks the
        # 23-odd tests that read real data. This step is the remedy the guard's own
        # error message names, promoted into the workflow so nobody has to know it.
        #
        # Two things make this safe rather than a hole in the guard:
        #   - it runs with the guard explicitly disabled and *before* the gated suite,
        #     so no test that is supposed to be offline can quietly depend on it;
        #   - the gated suite below still runs with the guard ON, against the warmed
        #     cache. So a test that reaches the network anyway is still caught. Warming
        #     and gating are separate steps for exactly that reason.
        #
        # Skipped when the cache above was restored, because there is then nothing
        # to warm. A cache-hit on the prefix but a miss on the exact key still
        # counts as warm: `cache-matched-key` is the output that says "some entry
        # was restored", which is what this step's question actually is.
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PL_ALLOW_NETWORK: "1"
        # `continue-on-error` because a warm failure must not masquerade as a gate
        # failure: the gating suite below re-runs the same tests with the guard ON and
        # will fail properly, with a better message, if the cache is still cold.
        #
        # This step used to be `pytest tests/ -q 2>&1 | tail -20`. The pipe made the
        # step's exit status `tail`'s, which is always zero, so `continue-on-error`
        # was never reached and a cold-cache failure was reported as a step that
        # "succeeded". Two corrections:
        #   - `--ignore=tests/test_network_guard.py`, because those three tests
        #     assert the network block is in place and so *fail* when
        #     `PL_ALLOW_NETWORK=1` disables it. They are the guard working, not a
        #     warm failure, and the gating step below runs them properly.
        #   - `-m "not network"`, which deselects the one test that needs the
        #     4,649-file per-match understat archive. That is 70 of the 82 minutes
        #     above, for a test the gate does not run.
        # With the pipe gone the step has a real exit status, and
        # `continue-on-error` is doing the job its comment describes.
        continue-on-error: true
        run: >-
          pytest tests/ -q -m "not network"
          --ignore=tests/test_network_guard.py

      - name: Gating suite
        # The gate runs with the network guard ON, against the cache warmed by the
        # step above. So it no longer depends on FPL, ClubElo or football-data.co.uk
        # being up *at gate time* -- which was the unresolved limitation recorded here,
        # and which made an upstream outage turn this gate red for reasons unrelated to
        # the change under review.
        #
        # What remains is honest and smaller: if the cache is cold and the warm step
        # cannot reach an upstream, the gate is still red, and legibly so, because the
        # warm step is where that failure lands and says so.
        #
        # CORRECTION 2026-09-27. This repo previously ran `pytest -m "not
        # network"` and claimed the suite was offline. That was false, and it was
        # false in a way that would have shipped: `data/cache/` is gitignored
        # (only `.gitkeep` is tracked), so a fresh checkout has no FPL player-
        # gameweek archive, no ClubElo ratings and no football-data.co.uk CSVs.
        # `load_player_gw_history` and friends fetch them, so **this suite needs
        # the network**, and `-m "not network"` was deselecting nothing because
        # no test in this repo carries the marker.
        #
        # The marker is now registered so tests that genuinely must not touch the
        # network can be marked, and the split below becomes real rather than
        # decorative. Until tests are actually marked, both halves run the same
        # tests and the honest description is: one suite, network required.
        #
        # The caches are restored below so repeat runs are not re-fetching several
        # seasons of FPL history every time.
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/ -q -m "not network"

      - name: Network-marked tests (live upstreams)
        # Informational, not gating: a failure here usually means an upstream
        # schema change, which is worth seeing but should not block a source PR.
        #
        # Selects 2 of 567. It selected 0 until 2026-09-28, which is what made
        # the `-m not network` gating split above decorative -- a marker
        # nothing carries deselects nothing, and the gating step was running the
        # whole suite on both halves rather than dividing it.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/ -q -m network

      - name: Lint
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          ruff check src tests --select E9,F63,F7,F82 || \
            (echo "::error::ruff found blocking errors"; exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
