name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    # Populates data/cache/ from FPL, ClubElo and football-data.co.uk.
    #
    # Separate job from the gate because it does not fit the gate's budget: the
    # understat shot loader fetches one file per match with a 0.3s delay, ~4,600
    # requests for the full historical window. Own job is also what keeps the
    # *gate* fast, which is the point of having a gate.
    #
    # The 150-minute ceiling is sized from what the job actually does, not from
    # the one run that failed. Run 36467464533 (2026-09-28) completed the whole
    # suite in 5330.00s -- `3 failed, 524 passed, 27 skipped` -- and 1m02s of
    # setup, i.e. ~90 of the 150 minutes. It was not cut short: the step
    # `success`, it was not cancelled, and the job's post-step then saved the
    # cache. (The 3 failures are `test_network_guard.py`, which cannot pass here
    # by construction: this step sets PL_ALLOW_NETWORK=1, so the guard is off.)
    # 150 is therefore ~1.67x the observed cost -- honest headroom for a slower
    # upstream, and a hard bound so a hung fetch cannot hold CI for hours.
    # `concurrency.cancel-in-progress: true` means a superseded run dies at once,
    # so the generous ceiling costs nothing on a busy branch.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Stamp the day
        # Same key as the gate job, so the gate restores exactly what this saved.
        id: date
        run: echo "stamp=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore any partial upstream cache
        # So an interrupted warm resumes. Prefix match, not the same key:
        # actions/cache skips a save when the key already exists.
        uses: actions/cache@v4
        with:
          path: data/cache
          key: pl-upstream-caches-${{ steps.date.outputs.stamp }}
          restore-keys: pl-upstream-caches-
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest pytest-mock ruff
      - name: Warm the upstream cache
        # continue-on-error on the STEP deliberately: a run killed partway has usually
        # downloaded most of the data, and we want the post-job step to save that
        # partial cache so the next attempt resumes instead of restarting.
        #
        # It also means this job cannot go red on a test regression -- it is a
        # cache warmer, not a check, and the `pytest` job below is the check. The
        # cost of that is real and accepted deliberately: a genuine failure in
        # the suite still warms the cache, and the gate is what reports it.
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PL_ALLOW_NETWORK: "1"
        run: pytest tests/ -q 2>&1 | tail -30

  pytest:
    # The gate. Network guard ON, against the warmed cache, so it does not depend on
    # any third party being available at gate time.
    needs: warm-cache
    # always() so a warm failure still produces a verdict. Without it a failed warm
    # skips the gate and a broken PR looks green because nothing ran.
    if: always()
    runs-on: ubuntu-latest
    # 45 minutes, sized from the suite's structural cost -- not from the one run
    # that was cancelled under this job's old 20-minute ceiling.
    #
    # The 20 minutes was a guess, and the guess was wrong. What the suite costs:
    #   * warm, local, full cache, all 553 gating tests: 362.36s (6m02s).
    #   * the same first 144 tests on a CI runner took 2m15s against 1m06s
    #     locally, so a CI runner costs roughly 2x this machine on the tests
    #     that are not waiting on anything.
    #   * job overhead before pytest starts: ~64s (checkout, setup-python with
    #     its pip cache, the data/cache restore, `pip install -e .`).
    # That puts a warm gate at ~14 minutes, so 45 is ~3.2x the number derived
    # from structure. The extra headroom is deliberate: a gate that cancels is
    # indistinguishable from a gate that hung, and a false negative on a PR is
    # worse than a slow PR. It is still a hard bound an order of magnitude under
    # GitHub's 6-hour default, and `concurrency.cancel-in-progress: true` means a
    # superseded run is killed immediately, so a generous ceiling does not
    # accumulate cost on a busy branch.
    #
    # What would tighten it: run 36467464533 was NOT warm-fast -- it reached 39%
    # in 19m16s, and the whole of tests 145-216 took 16m09s of that, against
    # seconds for the same block locally. That gap is unexplained and is worth
    # chasing with `--durations` on the runner before trusting a smaller number.
    # One run is one sample; this ceiling is not derived from it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Stamp the day
        id: date
        run: echo "stamp=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore the cache warmed above
        uses: actions/cache@v4
        with:
          path: data/cache
          key: pl-upstream-caches-${{ steps.date.outputs.stamp }}
          restore-keys: pl-upstream-caches-
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest pytest-mock ruff
      - name: Gating suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/ -q -m "not network"
      - name: Network-marked tests (live upstreams)
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/ -q -m network
      - name: Lint
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          ruff check src tests --select E9,F63,F7,F82 || \
            (echo "::error::ruff found blocking errors"; exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
