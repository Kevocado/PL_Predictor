name: Refresh public snapshot

# Runs public_snapshot.py on GitHub's own infrastructure (full RAM, no
# reliance on your laptop being on) and pushes data/public_snapshot.json if
# it changed — Render's autoDeploy then picks up that push automatically.
# See README's "Deploying a public, read-only version" section.

on:
  schedule:
    # Checked this against this season's own real fixture list
    # (fd_org_matches' actual commence_time values, not a guess): kickoffs
    # happen on Friday, Saturday, Sunday, Monday, AND Wednesday (rearranged/
    # midweek fixtures) — never just the weekend. The earliest kickoff all
    # season is 11:30 UTC (Saturday), the latest is 20:00 UTC (Monday/
    # Wednesday). A match plus stoppage time is done within ~2-2.5h, so
    # 11:00-22:00 UTC covers every kickoff-to-final-whistle window on any
    # day it could happen, without needing a separate weekday/weekend split
    # or per-slot cron entries that would break the moment fixtures get
    # rearranged. Cron's hour/day fields are UTC, same as everything here.
    - cron: "7 11-22 * * *"
  workflow_dispatch: {} # "Run workflow" button on this workflow's Actions page — a manual refresh-now.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -e . -c requirements-lock.txt

      # data/cache/ (FPL player summaries, odds, historical match data,
      # ESPN, etc. — all gitignored) is what makes repeated local runs of
      # public_snapshot.py fast: each entry has its own TTL, so a warm
      # cache mostly reuses prior results instead of live-fetching again.
      # A fresh checkout starts with none of that — confirmed the build
      # step alone took ~11 minutes here vs ~5 minutes locally, almost
      # entirely explained by paying every TTL's cold-start cost on every
      # single scheduled run. Restoring the most recent cache (by prefix)
      # and always saving a new one under this run's own key lets it warm
      # up across runs the same way a laptop naturally does.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      - name: Build snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m pl_predictor.public_snapshot

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/public_snapshot.json; then
            echo "No change, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public_snapshot.json
          git commit -m "Refresh public snapshot [automated]"
          git push
