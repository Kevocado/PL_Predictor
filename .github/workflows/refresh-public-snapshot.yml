name: Refresh public snapshot

# Runs public_snapshot.py on GitHub's own infrastructure (full RAM, no
# reliance on your laptop being on) and pushes data/public_snapshot.json if
# it changed — Azure's deploy-on-push then serves it (see README's
# "Deploying a public, read-only version" section, and its note that the
# live public deployment now runs on Azure Container Apps).

on:
  schedule:
    # Checked this against this season's own real fixture list
    # (fd_org_matches' actual commence_time values, not a guess): kickoffs
    # happen on Friday, Saturday, Sunday, Monday, AND Wednesday (rearranged/
    # midweek fixtures) — never just the weekend. The earliest kickoff all
    # season is 11:30 UTC (Saturday), the latest is 20:00 UTC (Monday/
    # Wednesday). A match plus stoppage time is done within ~2-2.5h, so
    # 11:00-22:00 UTC covers every kickoff-to-final-whistle window on any
    # day it could happen, without needing a separate weekday/weekend split
    # or per-slot cron entries that would break the moment fixtures get
    # rearranged. Cron's hour/day fields are UTC, same as everything here.
    #
    # Runs every 20 minutes across that window on matchdays so scores,
    # gameweek promotion, and odds move close to live as games are played.
    # This does NOT add Sportsbook API load beyond what it already used at
    # the old weekly cadence: repeated runs inside SPORTSBOOK_CACHE_TTL_SECONDS
    # (2h, see config.py) just reuse the same disk-cached odds, so requests
    # only actually go out ~12x/day regardless of how often this fires
    # (~120/day for a 10-fixture gameweek, still well under the Sportsbook
    # API's 150/day cap -- see data/sportsbook_api.py). One extra daily run
    # outside the match window catches everything else (team news, price
    # moves, postponements, a new gameweek's fixture list appearing).
    - cron: "*/20 11-21 * * 0,1,3,5,6"  # Every 20 min, 11:00-21:59 UTC, Sun/Mon/Wed/Fri/Sat
    - cron: "0 8 * * *"  # Daily catch-all outside the match window, 08:00 UTC
  workflow_dispatch: {} # "Run workflow" button on this workflow's Actions page — a manual refresh-now.

permissions:
  contents: write

# The build step below regularly takes 7-20+ minutes (see "Restore data
# cache"'s docstring on cold-cache cost) -- long enough for an unrelated
# push to land on main while this run is still building. Queue overlapping
# runs of this workflow itself rather than racing each other on the same
# push below.
concurrency:
  group: refresh-public-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -e . -c requirements-lock.txt

      # data/cache/ (FPL player summaries, odds, historical match data,
      # ESPN, etc. — all gitignored) is what makes repeated local runs of
      # public_snapshot.py fast: each entry has its own TTL, so a warm
      # cache mostly reuses prior results instead of live-fetching again.
      # A fresh checkout starts with none of that — confirmed the build
      # step alone took ~11 minutes here vs ~5 minutes locally, almost
      # entirely explained by paying every TTL's cold-start cost on every
      # single scheduled run. Restoring the most recent cache (by prefix)
      # and always saving a new one under this run's own key lets it warm
      # up across runs the same way a laptop naturally does.
      #
      # data/tracking.db is cached here too, and this is a correctness fix
      # rather than a speed one — the reason it was missing is the reason the
      # track record was dishonest. The two paths look adjacent and are not:
      # config.py resolves the database to `data/tracking.db`, and only
      # `data/cache` was being restored, so every scheduled run began with an
      # EMPTY tracking store. A pre-kickoff pick is written once, before
      # kickoff, and never rewritten (predictions are INSERT OR IGNORE), so an
      # empty store per run means no in-time pick was ever kept: the live
      # payload showed n_rebuilt 50 of 50, which is the signature of exactly
      # this. Restoring the file is what lets a stored pre-kickoff pick survive
      # to the next run, and the immutability that keeps it honest is already
      # structural in the schema.
      #
      # A DIFFERENT key from the one above, and deliberately. `data-cache-` is
      # keyed per run id and per TTL because its contents are disposable; the
      # tracking database is the opposite — it is the accumulating record, so
      # it is restored with a prefix. Run ids grow without bound and a per-run
      # key for a file that must persist is the same bug one level down.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      # CACHE IS AN ACCELERATOR HERE, NOT THE RECORD. The pre-kickoff picks are
      # the product's evidence and actions/cache is not durable storage: entries
      # are evicted after 7 days of no access, and a cache is not written at all
      # when the job that would write it fails. Either way the picks are gone
      # and the honest headline returns to null. The durable copy is
      # `data/tracking_picks.jsonl` (see "Record durable pre-kickoff picks"),
      # which is committed; this step only avoids re-deriving what is already
      # known. Deleting this step would slow the workflow and lose nothing.
      - name: Restore tracking database
        uses: actions/cache@v4
        with:
          path: data/tracking.db
          # `github.run_attempt`, not `github.run_id`. actions/cache does not
          # re-save on an exact key hit: re-running a run that already saved
          # `tracking-db-<run_id>` restores that same cache, and anything
          # recorded in between is never written anywhere. `run_attempt`
          # increments on a re-run, so each attempt gets its own key and the
          # save always happens. The `data/cache` step above keeps `run_id`,
          # because its contents really are disposable and an unchanged key is
          # the cheaper outcome there.
          key: tracking-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tracking-db-

      - name: Build snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSBOOK_API_KEY: ${{ secrets.SPORTSBOOK_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m pl_predictor.public_snapshot

      # The durable record, written AFTER the snapshot build so the picks the
      # build just recorded are included, and committed below with it.
      #
      # Appends every stored pick, with `made_before_kickoff` derived per row
      # from its own `snapshotted_at` and its own `commence_time` as UTC
      # instants. Since the 2026-10-01 reversal this is ALL of them: the record
      # used to skip picks made after their own kickoff, which is why it shipped
      # empty (0 lines) and the headline shipped null. A re-run still appends
      # nothing, so a no-op run is an empty diff.
      - name: Record durable picks
        run: |
          python - <<'PY'
          import sqlite3
          from pl_predictor.config import TRACKING_DB_PATH
          from pl_predictor.tracking.pick_record import append_picks

          if not TRACKING_DB_PATH.exists():
              print("no tracking.db yet; nothing to record")
              raise SystemExit(0)
          conn = sqlite3.connect(str(TRACKING_DB_PATH))
          conn.row_factory = sqlite3.Row
          rows = [dict(r) for r in conn.execute(
              "SELECT event_id, team_home, team_away, market, outcome_name, "
              "predicted_prob, commence_time, snapshotted_at FROM predictions")]
          conn.close()
          n = append_picks(rows)
          print(f"recorded {n} new pick(s) of {len(rows)} stored")
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/public_snapshot.json data/tracking_picks.jsonl; then
            echo "No change, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The pick record is committed ALONGSIDE the snapshot, and that is
          # deliberate: they are written in the same run, and a run that
          # committed one and not the other would leave the evidence behind the
          # published number out of step with the number itself.
          git add data/public_snapshot.json data/tracking_picks.jsonl
          git commit -m "Refresh public snapshot and record pre-kickoff picks [automated]"

          # This build regularly takes long enough for an unrelated commit
          # to land on main first (confirmed live: a plain `git push` here
          # got rejected as non-fast-forward after a couple of unrelated
          # pushes landed during a 7-minute build). `git rebase` (not
          # `reset --soft` + recommit -- tried and rejected: it silently
          # drops every file the concurrent commit(s) touched, since the
          # index never picks up origin's tree, only HEAD moves) replays
          # this one commit's actual diff on top of the new tip, so
          # whatever landed on main in the meantime is preserved.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- main moved, rebasing this commit onto it and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebase conflict onto origin/main -- needs a human look, not blind retry."
              exit 1
            fi
          done
          echo "::error::Failed to push data/public_snapshot.json after 5 retries."
          exit 1
